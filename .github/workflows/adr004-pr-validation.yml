name: ADR-004 Qwen Live PR Validation

on:
  pull_request:
    branches: [baseline/build317-toolcall]

permissions:
  contents: read

jobs:
  qwen-live-validation:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        shell: pwsh
        run: python -m pip install --upgrade pip; python -m pip install -e ".[dev,windows-audio,cloud-realtime]"
      - name: Run preserved Build 317 audio, Qwen tool-call and live-audio regressions
        shell: pwsh
        run: python -m pytest -q tests/test_launcher_audio_sections.py tests/test_realtime_tool_api.py tests/test_qwen_realtime_provider.py tests/test_qwen_live_audio_core.py tests/test_cloud_voice_config_store.py tests/test_core_process_boundary.py
      - name: Compile realtime modules
        shell: pwsh
        run: python -m compileall -q orion/qwen_realtime_provider.py orion/qwen_live_audio_core.py orion/realtime_tool_api.py orion/launcher_cloud_voice_sections.py orion/launcher_audio_sections.py
      - name: Build Core with realtime dependencies
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name ORION-Core-ADR004 --collect-submodules orion --collect-submodules uvicorn --collect-submodules websocket --collect-submodules aiohttp --add-data "dcs-export;dcs-export" --icon branding/orion.ico orion/core_main.py
