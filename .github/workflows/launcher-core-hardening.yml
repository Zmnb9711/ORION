name: Launcher Core Hardening

on:
  workflow_dispatch:
  push:
    branches:
      - hardening/launcher-core
    paths:
      - "orion/**"
      - "tests/**"
      - "packaging/**"
      - ".github/workflows/launcher-core-hardening.yml"

permissions:
  contents: read

jobs:
  hardening:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,windows-audio]"

      - name: Run Launcher Core hardening regression tests
        shell: pwsh
        run: |
          python -m pytest -q `
            tests/test_core_process_hardening.py `
            tests/test_canonical_launcher_boundary.py `
            tests/test_launcher_shell_hardening.py `
            tests/test_launcher_close_contract.py `
            tests/test_launcher_conversation_test.py `
            tests/test_launcher_core_client.py `
            tests/test_component_uninstall.py `
            tests/test_dcs_readiness.py `
            tests/test_whisper_stt_hardening.py

      - name: Build headless console ORION Core
        shell: pwsh
        run: |
          $args = @(
            "--noconfirm", "--clean", "--onedir", "--console",
            "--name", "ORION-Core",
            "--collect-submodules", "orion",
            "--collect-submodules", "uvicorn",
            "--add-data", "dcs-export;dcs-export",
            "--add-data", "dcs-mission-pack;dcs-mission-pack",
            "--add-data", "dcs-mission-template;dcs-mission-template",
            "--icon", "branding/orion.ico",
            "orion/core_main.py"
          )
          python -m PyInstaller @args
          if (-not (Test-Path "dist/ORION-Core/ORION-Core.exe")) { throw "ORION-Core.exe was not created" }

      - name: Build ORION Launcher
        shell: pwsh
        run: |
          $args = @(
            "--noconfirm", "--clean", "--onedir", "--windowed",
            "--name", "ORION-Launcher",
            "--collect-submodules", "orion",
            "--collect-submodules", "uvicorn",
            "--add-data", "dcs-export;dcs-export",
            "--icon", "branding/orion.ico",
            "--add-data", "branding/orion.ico;branding",
            "orion/launcher_main.py"
          )
          python -m PyInstaller @args
          if (-not (Test-Path "dist/ORION-Launcher/ORION-Launcher.exe")) { throw "ORION-Launcher.exe was not created" }

      - name: Build ORION uninstall helper
        shell: pwsh
        run: |
          $args = @(
            "--noconfirm", "--clean", "--onedir", "--windowed",
            "--name", "ORION-Uninstall",
            "--collect-submodules", "orion",
            "--icon", "branding/orion.ico",
            "orion/uninstall_main.py"
          )
          python -m PyInstaller @args
          if (-not (Test-Path "dist/ORION-Uninstall/ORION-Uninstall.exe")) { throw "ORION-Uninstall.exe was not created" }

      - name: Frozen Core runtime context and health smoke test
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP "orion-hardening-core-runtime"
          Remove-Item $runtime -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $runtime | Out-Null
          $env:ORION_RUNTIME_DIR = $runtime
          $process = Start-Process -FilePath "dist/ORION-Core/ORION-Core.exe" -ArgumentList "--port","8131" -WorkingDirectory "dist/ORION-Core" -WindowStyle Hidden -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              if ($process.HasExited) { throw "ORION Core exited early with code $($process.ExitCode)" }
              try {
                $response = Invoke-RestMethod -Uri "http://127.0.0.1:8131/health" -TimeoutSec 1
                if ($response.status -eq "ok") { $ready = $true; break }
              } catch {}
            }
            if (-not $ready) { throw "Headless console Core did not become healthy" }
            $startupLog = Join-Path $runtime "core-startup.log"
            if (-not (Test-Path $startupLog)) { throw "Core startup context log missing" }
            $text = Get-Content $startupLog -Raw
            if ($text -notmatch "frozen=True") { throw "Startup log did not confirm frozen Core" }
            if ($text -notmatch "process_role=core") { throw "Startup log did not confirm Core process role" }
            if ($text -notmatch "cwd=") { throw "Startup log did not record cwd" }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Assemble hardening product layout
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "dist-product/Core" | Out-Null
          New-Item -ItemType Directory -Force "dist-product/Launcher" | Out-Null
          New-Item -ItemType Directory -Force "dist-product/Uninstaller" | Out-Null
          New-Item -ItemType Directory -Force "dist-product/Integration/DCS/Export" | Out-Null
          New-Item -ItemType Directory -Force "dist-product/Integration/DCS/MissionPack" | Out-Null
          New-Item -ItemType Directory -Force "dist-product/Integration/DCS/MissionTemplate" | Out-Null
          Copy-Item "dist/ORION-Core/*" "dist-product/Core" -Recurse -Force
          Copy-Item "dist/ORION-Launcher/*" "dist-product/Launcher" -Recurse -Force
          Copy-Item "dist/ORION-Uninstall/*" "dist-product/Uninstaller" -Recurse -Force
          Copy-Item "dcs-export/*" "dist-product/Integration/DCS/Export" -Recurse -Force
          Copy-Item "dcs-mission-pack/*" "dist-product/Integration/DCS/MissionPack" -Recurse -Force
          Copy-Item "dcs-mission-template/*" "dist-product/Integration/DCS/MissionTemplate" -Recurse -Force
          $required = @(
            "dist-product/Core/ORION-Core.exe",
            "dist-product/Launcher/ORION-Launcher.exe",
            "dist-product/Uninstaller/ORION-Uninstall.exe",
            "dist-product/Integration/DCS/Export/Export.lua"
          )
          foreach ($path in $required) { if (-not (Test-Path $path)) { throw "Missing hardening payload: $path" } }

      - name: Locate Inno Setup
        id: inno
        shell: pwsh
        run: |
          $candidates = @("C:\Program Files (x86)\Inno Setup 6\ISCC.exe", "C:\Program Files\Inno Setup 6\ISCC.exe")
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "Inno Setup compiler not found" }
          "iscc=$iscc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Compile installer packaging smoke
        shell: pwsh
        run: |
          & "${{ steps.inno.outputs.iscc }}" "packaging/orion-alpha.iss"
          if (-not (Test-Path "dist-installer/ORION-Alpha-0.2-Setup.exe")) { throw "Hardening installer was not created" }
