name: ORION Windows Installer Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "orion/**"
      - "dcs-export/**"
      - "dcs-mission-pack/**"
      - "dcs-mission-template/**"
      - "branding/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/installer-smoke.yml"
  push:
    branches: [main, voice/worker-launcher-lifecycle-v01]

jobs:
  installer-lifecycle:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,windows-audio,cloud-realtime,srs-radio]"

      - name: Run Qwen and legacy-removal regression tests
        shell: pwsh
        run: python -m pytest -q tests/test_qwen_live_audio_core.py tests/test_qwen_live_audio_architecture.py tests/test_realtime_live_core.py tests/test_realtime_session_control.py tests/test_yandex_realtime_provider.py tests/test_yandex_live_audio_core.py tests/test_yandex_live_lifecycle.py tests/test_yandex_playback_interrupt.py tests/test_yandex_credentials.py tests/test_yandex_realtime_session.py tests/test_yandex_srs_live_core.py tests/test_srs_protocol.py tests/test_srs_radio_transport.py tests/test_srs_codec_resampler.py tests/test_srs_transmission.py tests/test_srs_diagnostics.py tests/test_srs_packaging.py tests/test_legacy_voice_removal.py

      - name: Build Core and Launcher
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name ORION-Core --collect-submodules orion --collect-submodules uvicorn --collect-submodules websocket --collect-submodules aiohttp --collect-all samplerate --collect-all numpy --add-binary "orion/native/win_amd64/opus.dll;native/win_amd64" --add-data "orion/native/licenses;native/licenses" --add-data "dcs-export;dcs-export" --add-data "dcs-mission-pack;dcs-mission-pack" --add-data "dcs-mission-template;dcs-mission-template" --icon branding/orion.ico orion/core_main.py
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name ORION-Launcher --collect-submodules orion --collect-submodules uvicorn --collect-submodules websocket --collect-submodules aiohttp --exclude-module grpc --exclude-module google.protobuf --exclude-module samplerate --exclude-module numpy --exclude-module orion.srs_opus --exclude-module orion.srs_resampler --exclude-module orion.srs_protocol --exclude-module orion.srs_transmission --exclude-module orion.srs_radio_transport --exclude-module orion.srs_radio_adapter --exclude-module orion.srs_diagnostics --exclude-module orion.yandex_speechkit_stt --exclude-module orion.yandex_speechkit_v3_proto --exclude-module orion.yandex_srs_live_core --add-data "dcs-export;dcs-export" --icon branding/orion.ico --add-data "branding/orion.ico;branding" orion/launcher_main.py

      - name: Stamp exact frozen build identity
        shell: pwsh
        run: |
          python -m orion.build_identity_packaging --core-dir dist/ORION-Core --launcher-dir dist/ORION-Launcher --sha "${{ github.sha }}" --branch "${{ github.ref_name }}"
          foreach ($marker in @("dist/ORION-Core/build-identity.json","dist/ORION-Launcher/build-identity.json")) {
            $identity = Get-Content $marker -Raw | ConvertFrom-Json
            if ($identity.sha -ne "${{ github.sha }}") { throw "Frozen build identity mismatch: $marker" }
          }

      - name: Run offline frozen Launcher SRS control smoke
        shell: pwsh
        run: |
          $resultPath = Join-Path $env:RUNNER_TEMP "orion-launcher-srs-control-smoke.json"
          $process = Start-Process "dist/ORION-Launcher/ORION-Launcher.exe" -ArgumentList @("--srs-control-smoke",$resultPath) -Wait -PassThru
          if ($process.ExitCode) { throw "Frozen Launcher SRS control smoke exited $($process.ExitCode)" }
          $result = Get-Content $resultPath -Raw | ConvertFrom-Json
          if (-not $result.ok -or $result.external_process_started -or $result.network_used -or $result.audio_devices_opened) { throw "Frozen Launcher SRS control smoke failed" }
          if (Get-ChildItem "dist/ORION-Launcher" -Recurse -File | Where-Object { $_.Name -match "^(SRS-Server\.exe|SR-ClientRadio\.exe|opus\.dll|_samplerate.*|numpy.*)$" }) { throw "Launcher unexpectedly contains SRS external/native runtime" }

      - name: Run offline frozen Core SRS native smoke
        shell: pwsh
        run: |
          $resultPath = Join-Path $env:RUNNER_TEMP "orion-core-srs-native-smoke.json"
          $process = Start-Process "dist/ORION-Core/ORION-Core.exe" -ArgumentList @("--srs-native-smoke", $resultPath) -Wait -PassThru
          if ($process.ExitCode) { throw "Frozen Core SRS smoke exited $($process.ExitCode)" }
          $result = Get-Content $resultPath -Raw | ConvertFrom-Json
          if (-not $result.ok -or $result.opus_version -ne "libopus 1.6.1" -or $result.network_used -or $result.audio_devices_opened) { throw "Frozen SRS native smoke failed" }
          if (Get-ChildItem "dist/ORION-Launcher" -Recurse -File | Where-Object { $_.Name -match "^(opus\.dll|_samplerate.*|numpy.*)$" }) { throw "Launcher unexpectedly contains SRS native runtime" }

      - name: Assemble canonical installer payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "dist-product/Core","dist-product/Launcher","dist-product/Integration/DCS/Export","dist-product/Integration/DCS/MissionPack","dist-product/Integration/DCS/MissionTemplate" | Out-Null
          Copy-Item "dist/ORION-Core/*" "dist-product/Core" -Recurse -Force
          Copy-Item "dist/ORION-Launcher/*" "dist-product/Launcher" -Recurse -Force
          Copy-Item "dcs-export/*" "dist-product/Integration/DCS/Export" -Recurse -Force
          Copy-Item "dcs-mission-pack/*" "dist-product/Integration/DCS/MissionPack" -Recurse -Force
          Copy-Item "dcs-mission-template/*" "dist-product/Integration/DCS/MissionTemplate" -Recurse -Force
          if (Test-Path "dist-product/Voice") { throw "Legacy Voice directory must not exist" }

      - name: Prove exact assembled Launcher starts and shuts down exact Core
        shell: pwsh
        run: |
          $resultPath = Join-Path $env:RUNNER_TEMP "orion-integrated-product-smoke.json"
          $runtime = Join-Path $env:RUNNER_TEMP "orion-integrated-product-runtime"
          New-Item -ItemType Directory -Force $runtime | Out-Null
          $env:ORION_RUNTIME_DIR = $runtime
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start(); $port = $listener.LocalEndpoint.Port; $listener.Stop()
          $launcher = "dist-product/Launcher/ORION-Launcher.exe"
          $process = Start-Process $launcher -ArgumentList @("--host","127.0.0.1","--port",$port,"--integrated-product-smoke",$resultPath) -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode) { throw "Integrated product smoke exited $($process.ExitCode)" }
          $result = Get-Content $resultPath -Raw | ConvertFrom-Json
          if (-not $result.ok -or -not $result.core_health_ok -or -not $result.shutdown_ok -or $result.orphan_core_process) { throw "Integrated product smoke failed" }

      - name: Locate Inno Setup
        id: inno
        shell: pwsh
        run: |
          $candidates = @("C:\Program Files (x86)\Inno Setup 6\ISCC.exe", "C:\Program Files\Inno Setup 6\ISCC.exe")
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "Inno Setup compiler not found" }
          "iscc=$iscc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build installer
        shell: pwsh
        run: |
          & "${{ steps.inno.outputs.iscc }}" "packaging/orion-alpha.iss"
          if (-not (Test-Path "dist-installer/ORION-Alpha-0.2-Setup.exe")) { throw "Installer was not created" }

      - name: Silent install, legacy cleanup, repair install, and complete uninstall
        shell: pwsh
        run: |
          $setup = (Resolve-Path "dist-installer/ORION-Alpha-0.2-Setup.exe").Path
          $installDir = Join-Path $env:ProgramFiles "ORION"
          $launcherDir = Join-Path $installDir "Launcher"
          $coreDir = Join-Path $installDir "Core"
          $integrationDir = Join-Path $installDir "Integration"
          $launcher = Join-Path $launcherDir "ORION-Launcher.exe"
          $core = Join-Path $coreDir "ORION-Core.exe"
          $launcherIdentity = Join-Path $launcherDir "build-identity.json"
          $coreIdentity = Join-Path $coreDir "build-identity.json"
          $export = Join-Path $integrationDir "DCS\Export\Export.lua"
          $uninstaller = Join-Path $installDir "unins000.exe"
          $runtimeDir = Join-Path $env:LOCALAPPDATA "ORION\runtime"

          function Invoke-Setup([string]$arguments) {
            $process = Start-Process -FilePath $setup -ArgumentList $arguments -PassThru -Wait
            if ($process.ExitCode -ne 0) { throw "Installer exited with code $($process.ExitCode): $arguments" }
          }

          Invoke-Setup "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-"
          foreach ($path in @($launcher,$core,$launcherIdentity,$coreIdentity,$export,$uninstaller,$runtimeDir)) {
            if (-not (Test-Path $path)) { throw "Installed payload missing: $path" }
          }
          foreach ($marker in @($launcherIdentity,$coreIdentity)) {
            if ((Get-Content $marker -Raw | ConvertFrom-Json).sha -ne "${{ github.sha }}") { throw "Installed build identity mismatch: $marker" }
          }
          $nativeResult = Join-Path $env:RUNNER_TEMP "orion-installed-core-srs-native.json"
          $nativeProcess = Start-Process $core -ArgumentList @("--srs-native-smoke",$nativeResult) -Wait -PassThru
          if ($nativeProcess.ExitCode -ne 0) { throw "Installed Core SRS native smoke exited $($nativeProcess.ExitCode)" }
          $nativeJson = Get-Content $nativeResult -Raw | ConvertFrom-Json
          if (-not $nativeJson.ok -or $nativeJson.network_used -or $nativeJson.audio_devices_opened) { throw "Installed Core SRS native smoke failed" }
          $launcherResult = Join-Path $env:RUNNER_TEMP "orion-installed-launcher-srs-control.json"
          $launcherSmoke = Start-Process $launcher -ArgumentList @("--srs-control-smoke",$launcherResult) -Wait -PassThru
          if ($launcherSmoke.ExitCode -ne 0) { throw "Installed Launcher SRS smoke exited $($launcherSmoke.ExitCode)" }
          $launcherJson = Get-Content $launcherResult -Raw | ConvertFrom-Json
          if (-not $launcherJson.ok -or $launcherJson.external_process_started -or $launcherJson.network_used -or $launcherJson.audio_devices_opened) { throw "Installed Launcher SRS smoke failed" }

          New-Item -ItemType Directory -Force "$installDir\Voice\whisper","$runtimeDir\voice","$runtimeDir\stt\whisper.cpp" | Out-Null
          Set-Content "$installDir\Voice\ORION-Voice.exe" "controlled legacy fixture"
          Set-Content "$runtimeDir\voice\state.json" "{}"
          Set-Content "$runtimeDir\stt\whisper.cpp\legacy.bin" "controlled legacy fixture"
          $staleIdentity = @{sha="5eae997e76e208727141bf596eb73141be55e0b9";branch="dev/adr004-post-389";version="0.2.0-alpha"} | ConvertTo-Json
          Set-Content $launcherIdentity $staleIdentity
          Set-Content $coreIdentity $staleIdentity

          Invoke-Setup "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-"
          foreach ($path in @($launcher,$core,$launcherIdentity,$coreIdentity,$export,$uninstaller)) {
            if (-not (Test-Path $path)) { throw "Payload missing after repair install: $path" }
          }
          foreach ($marker in @($launcherIdentity,$coreIdentity)) {
            if ((Get-Content $marker -Raw | ConvertFrom-Json).sha -ne "${{ github.sha }}") { throw "Repair install retained stale build identity: $marker" }
          }

          $coreProcess = Start-Process -FilePath $core -PassThru
          Start-Sleep -Seconds 2
          if ($coreProcess.HasExited) { throw "Core did not stay running for uninstall lock test" }

          foreach ($legacy in @("$installDir\Voice","$runtimeDir\voice","$runtimeDir\stt\whisper.cpp")) {
            if (Test-Path $legacy) { throw "Legacy artifact remained after repair install: $legacy" }
          }

          $uninstallProcess = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -PassThru -Wait
          if ($uninstallProcess.ExitCode -ne 0) { throw "Uninstaller exited with code $($uninstallProcess.ExitCode)" }
          Start-Sleep -Seconds 2

          foreach ($processName in @("ORION-Core")) {
            if (Get-Process -Name $processName -ErrorAction SilentlyContinue) { throw "$processName remained running after uninstall" }
          }
          foreach ($path in @($launcherDir,$coreDir,$integrationDir,$launcher,$core,$export,$uninstaller,$runtimeDir,$installDir)) {
            if (Test-Path $path) { throw "ORION content remained after uninstall: $path" }
          }

      - name: Upload installer smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ORION-Alpha-0.2-installer-smoke
          path: dist-installer/ORION-Alpha-0.2-Setup.exe
          if-no-files-found: ignore
