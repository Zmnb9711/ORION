name: ORION Windows Installer Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "orion/**"
      - "dcs-export/**"
      - "dcs-mission-pack/**"
      - "dcs-mission-template/**"
      - "branding/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/installer-smoke.yml"
  push:
    branches: [main, voice/worker-launcher-lifecycle-v01]

jobs:
  installer-lifecycle:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,windows-audio,cloud-realtime]"

      - name: Run Qwen and legacy-removal regression tests
        shell: pwsh
        run: python -m pytest -q tests/test_qwen_live_audio_core.py tests/test_qwen_live_audio_architecture.py tests/test_realtime_live_core.py tests/test_realtime_session_control.py tests/test_yandex_realtime_provider.py tests/test_yandex_live_audio_core.py tests/test_yandex_live_lifecycle.py tests/test_yandex_playback_interrupt.py tests/test_yandex_credentials.py tests/test_legacy_voice_removal.py

      - name: Build Core and Launcher
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name ORION-Core --collect-submodules orion --collect-submodules uvicorn --collect-submodules websocket --collect-submodules aiohttp --add-data "dcs-export;dcs-export" --add-data "dcs-mission-pack;dcs-mission-pack" --add-data "dcs-mission-template;dcs-mission-template" --icon branding/orion.ico orion/core_main.py
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name ORION-Launcher --collect-submodules orion --collect-submodules uvicorn --collect-submodules websocket --collect-submodules aiohttp --add-data "dcs-export;dcs-export" --icon branding/orion.ico --add-data "branding/orion.ico;branding" orion/launcher_main.py

      - name: Assemble canonical installer payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "dist-product/Core","dist-product/Launcher","dist-product/Integration/DCS/Export","dist-product/Integration/DCS/MissionPack","dist-product/Integration/DCS/MissionTemplate" | Out-Null
          Copy-Item "dist/ORION-Core/*" "dist-product/Core" -Recurse -Force
          Copy-Item "dist/ORION-Launcher/*" "dist-product/Launcher" -Recurse -Force
          Copy-Item "dcs-export/*" "dist-product/Integration/DCS/Export" -Recurse -Force
          Copy-Item "dcs-mission-pack/*" "dist-product/Integration/DCS/MissionPack" -Recurse -Force
          Copy-Item "dcs-mission-template/*" "dist-product/Integration/DCS/MissionTemplate" -Recurse -Force
          if (Test-Path "dist-product/Voice") { throw "Legacy Voice directory must not exist" }

      - name: Locate Inno Setup
        id: inno
        shell: pwsh
        run: |
          $candidates = @("C:\Program Files (x86)\Inno Setup 6\ISCC.exe", "C:\Program Files\Inno Setup 6\ISCC.exe")
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "Inno Setup compiler not found" }
          "iscc=$iscc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build installer
        shell: pwsh
        run: |
          & "${{ steps.inno.outputs.iscc }}" "packaging/orion-alpha.iss"
          if (-not (Test-Path "dist-installer/ORION-Alpha-0.2-Setup.exe")) { throw "Installer was not created" }

      - name: Silent install, legacy cleanup, repair install, and complete uninstall
        shell: pwsh
        run: |
          $setup = (Resolve-Path "dist-installer/ORION-Alpha-0.2-Setup.exe").Path
          $installDir = Join-Path $env:ProgramFiles "ORION"
          $launcherDir = Join-Path $installDir "Launcher"
          $coreDir = Join-Path $installDir "Core"
          $integrationDir = Join-Path $installDir "Integration"
          $launcher = Join-Path $launcherDir "ORION-Launcher.exe"
          $core = Join-Path $coreDir "ORION-Core.exe"
          $export = Join-Path $integrationDir "DCS\Export\Export.lua"
          $uninstaller = Join-Path $installDir "unins000.exe"
          $runtimeDir = Join-Path $env:LOCALAPPDATA "ORION\runtime"

          function Invoke-Setup([string]$arguments) {
            $process = Start-Process -FilePath $setup -ArgumentList $arguments -PassThru -Wait
            if ($process.ExitCode -ne 0) { throw "Installer exited with code $($process.ExitCode): $arguments" }
          }

          Invoke-Setup "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-"
          foreach ($path in @($launcher,$core,$export,$uninstaller,$runtimeDir)) {
            if (-not (Test-Path $path)) { throw "Installed payload missing: $path" }
          }

          New-Item -ItemType Directory -Force "$installDir\Voice\whisper","$runtimeDir\voice","$runtimeDir\stt\whisper.cpp" | Out-Null
          Set-Content "$installDir\Voice\ORION-Voice.exe" "controlled legacy fixture"
          Set-Content "$runtimeDir\voice\state.json" "{}"
          Set-Content "$runtimeDir\stt\whisper.cpp\legacy.bin" "controlled legacy fixture"

          Invoke-Setup "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-"
          foreach ($path in @($launcher,$core,$export,$uninstaller)) {
            if (-not (Test-Path $path)) { throw "Payload missing after repair install: $path" }
          }

          $coreProcess = Start-Process -FilePath $core -PassThru
          Start-Sleep -Seconds 2
          if ($coreProcess.HasExited) { throw "Core did not stay running for uninstall lock test" }

          foreach ($legacy in @("$installDir\Voice","$runtimeDir\voice","$runtimeDir\stt\whisper.cpp")) {
            if (Test-Path $legacy) { throw "Legacy artifact remained after repair install: $legacy" }
          }

          $uninstallProcess = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -PassThru -Wait
          if ($uninstallProcess.ExitCode -ne 0) { throw "Uninstaller exited with code $($uninstallProcess.ExitCode)" }
          Start-Sleep -Seconds 2

          foreach ($processName in @("ORION-Core")) {
            if (Get-Process -Name $processName -ErrorAction SilentlyContinue) { throw "$processName remained running after uninstall" }
          }
          foreach ($path in @($launcherDir,$coreDir,$integrationDir,$launcher,$core,$export,$uninstaller,$runtimeDir,$installDir)) {
            if (Test-Path $path) { throw "ORION content remained after uninstall: $path" }
          }

      - name: Upload installer smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ORION-Alpha-0.2-installer-smoke
          path: dist-installer/ORION-Alpha-0.2-Setup.exe
          if-no-files-found: ignore
