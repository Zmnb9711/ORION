name: ORION Publish Verified Installer

on:
  workflow_run:
    workflows:
      - ORION Windows Installer Smoke
    types:
      - completed

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Download installer from successful smoke run
        uses: actions/download-artifact@v4
        with:
          name: ORION-Alpha-0.2-installer-smoke
          path: release
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Publish verified prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: orion-alpha-0.2-smoke-${{ github.event.workflow_run.run_number }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: ORION Alpha 0.2 — Verified Smoke ${{ github.event.workflow_run.run_number }}
          prerelease: true
          body: |
            Verified ORION Alpha 0.2 Windows installer.

            This Setup.exe is taken directly from a successful ORION Windows Installer Smoke run on main.
            The smoke gate verifies installer creation, clean install, repair install, Core shutdown during uninstall, and complete product removal.
          files: release/ORION-Alpha-0.2-Setup.exe
