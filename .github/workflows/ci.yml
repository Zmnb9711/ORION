name: ORION CI

on:
  push:
    branches:
      - main
      - agent/initial-orion-core
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi pydantic httpx

      - name: Compile ORION modules
        run: python -m compileall -q orion

      - name: Run test suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q
