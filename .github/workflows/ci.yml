name: ORION CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orion-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,cloud-realtime,srs-radio]"

      - name: Compile ORION modules
        run: python -m compileall -q orion

      - name: Ruff correctness checks
        run: python -m ruff check orion tests

      - name: Pyright core hardening gate
        run: >-
          python -m pyright
          orion/core_main.py
          orion/core_process.py
          orion/mission_store.py
          orion/native_wasapi_player.py
          orion/windows_audio_worker_cli.py
          orion/windows_sapi_backend.py
          orion/airport_departure_runtime.py
          orion/airport_departure_control.py

      - name: Run test suite with coverage
        run: python -m pytest -q --cov=orion --cov-report=term-missing

  windows-smoke:
    name: Windows smoke (3.12)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,cloud-realtime,srs-radio]"

      - name: Compile ORION modules
        run: python -m compileall -q orion

      - name: Run Windows test suite
        run: python -m pytest -q

  lua-syntax:
    name: Lua syntax validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Validate Lua sources
        shell: bash
        run: |
          mapfile -d '' lua_files < <(find dcs-export dcs-mission-pack dcs-mission-template -type f -name '*.lua' -print0)
          if (( ${#lua_files[@]} == 0 )); then
            echo "No Lua files found"
            exit 1
          fi
          for file in "${lua_files[@]}"; do
            echo "Checking $file"
            luac -p "$file"
          done
