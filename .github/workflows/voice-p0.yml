name: ORION Voice P0 Installed Product

on:
  workflow_dispatch:
  push:
    branches:
      - fix/whisper-clean-field-repair
    paths:
      - "orion/**"
      - "packaging/**"
      - "tests/**"
      - ".github/workflows/voice-p0.yml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  voice-p0:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,windows-audio]"
      - name: Build installed-product payload
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --console --name ORION-Core --collect-submodules orion --collect-submodules uvicorn --add-data "dcs-export;dcs-export" --add-data "dcs-mission-pack;dcs-mission-pack" --add-data "dcs-mission-template;dcs-mission-template" --icon branding/orion.ico orion/core_main.py
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name ORION-Launcher --collect-submodules orion --collect-submodules uvicorn --add-data "dcs-export;dcs-export" --icon branding/orion.ico --add-data "branding/orion.ico;branding" orion/launcher_main.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name ORION-Uninstall --collect-submodules orion --icon branding/orion.ico orion/uninstall_main.py
          New-Item -ItemType Directory -Force "dist-product/Core","dist-product/Launcher","dist-product/Uninstaller","dist-product/Integration/DCS/Export","dist-product/Integration/DCS/MissionPack","dist-product/Integration/DCS/MissionTemplate" | Out-Null
          Copy-Item "dist/ORION-Core/*" "dist-product/Core" -Recurse -Force
          Copy-Item "dist/ORION-Launcher/*" "dist-product/Launcher" -Recurse -Force
          Copy-Item "dist/ORION-Uninstall.exe" "dist-product/Uninstaller/ORION-Uninstall.exe" -Force
          Copy-Item "dcs-export/*" "dist-product/Integration/DCS/Export" -Recurse -Force
          Copy-Item "dcs-mission-pack/*" "dist-product/Integration/DCS/MissionPack" -Recurse -Force
          Copy-Item "dcs-mission-template/*" "dist-product/Integration/DCS/MissionTemplate" -Recurse -Force
      - name: Build production installer
        shell: pwsh
        run: |
          $iscc = @("C:\Program Files (x86)\Inno Setup 6\ISCC.exe","C:\Program Files\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { choco install innosetup --yes --no-progress; $iscc = @("C:\Program Files (x86)\Inno Setup 6\ISCC.exe","C:\Program Files\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1 }
          if (-not $iscc) { throw "Inno Setup compiler not found" }
          & $iscc "packaging/orion-alpha.iss"
          if (-not (Test-Path "dist-installer/ORION-Alpha-0.2-Setup.exe")) { throw "Installer was not created" }
      - name: Install actual production installer
        shell: pwsh
        run: |
          Get-Process ORION-Launcher,ORION-Core -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\Program Files\ORION" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:LOCALAPPDATA "ORION") -Recurse -Force -ErrorAction SilentlyContinue
          $setup=(Resolve-Path "dist-installer/ORION-Alpha-0.2-Setup.exe").Path
          $p=Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
          if (-not (Test-Path "C:\Program Files\ORION\Core\ORION-Core.exe")) { throw "Installed Core missing" }
      - name: Prepare real Whisper runtime and speech WAV
        shell: pwsh
        run: |
          $runtime=Join-Path $env:RUNNER_TEMP "orion-voice-p0"
          $stt=Join-Path $runtime "stt\whisper.cpp"
          $dl=Join-Path $env:RUNNER_TEMP "orion-voice-p0-downloads"
          New-Item -ItemType Directory -Force $stt,$dl | Out-Null
          $zip=Join-Path $dl "whisper.zip"
          Invoke-WebRequest -Uri "https://github.com/ggml-org/whisper.cpp/releases/download/v1.8.6/whisper-bin-x64.zip" -OutFile $zip
          Expand-Archive $zip (Join-Path $dl "whisper") -Force
          $cli=Get-ChildItem (Join-Path $dl "whisper") -Recurse -Filter whisper-cli.exe | Select-Object -First 1
          if (-not $cli) { throw "whisper-cli missing" }
          Copy-Item (Join-Path $cli.Directory.FullName "*") $stt -Recurse -Force
          Set-Content (Join-Path $stt "ORION_WHISPER_RUNTIME_VERSION.txt") "v1.8.6" -Encoding UTF8
          $model=Join-Path $stt "ggml-tiny.en.bin"
          Invoke-WebRequest -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin?download=true" -OutFile $model
          $wav=Join-Path $dl "jfk.wav"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/ggml-org/whisper.cpp/master/samples/jfk.wav" -OutFile $wav
          "ORION_RUNTIME_DIR=$runtime" | Out-File $env:GITHUB_ENV -Append
          "ORION_WHISPER_ROOT=$stt" | Out-File $env:GITHUB_ENV -Append
          "ORION_WHISPER_MODEL=$model" | Out-File $env:GITHUB_ENV -Append
          "ORION_STT_SAMPLE=$wav" | Out-File $env:GITHUB_ENV -Append
      - name: VOICE P0 - real STT through installed Core
        shell: pwsh
        run: |
          $core="C:\Program Files\ORION\Core\ORION-Core.exe"
          $output=& $core --stt-smoke $env:ORION_STT_SAMPLE --stt-language en 2>&1
          $code=$LASTEXITCODE
          $text=($output | Out-String).Trim()
          Write-Host "STT_EXIT=$code"
          Write-Host "STT_TRANSCRIPT=$text"
          if ($code -ne 0) { throw "VOICE P0 STT failed: $code" }
          $n=$text.ToLowerInvariant()
          if ($n -notmatch "country" -or $n -notmatch "you") { throw "Unexpected STT transcript: $text" }
      - name: VOICE P0 - real TTS through installed Core
        shell: pwsh
        run: |
          $core="C:\Program Files\ORION\Core\ORION-Core.exe"
          $tts=Join-Path $env:RUNNER_TEMP "orion-voice-p0-reply.wav"
          & $core --tts-smoke $tts --tts-text "Всё хорошо. Связь установлена."
          if ($LASTEXITCODE -ne 0) { throw "VOICE P0 TTS failed" }
          if (-not (Test-Path $tts)) { throw "TTS WAV missing" }
          $size=(Get-Item $tts).Length
          if ($size -le 44) { throw "TTS WAV empty" }
          Write-Host "TTS_WAV=$tts"
          Write-Host "TTS_BYTES=$size"
          Write-Host "TTS_SHA256=$((Get-FileHash $tts -Algorithm SHA256).Hash)"
      - name: VOICE P0 - verdict
        shell: pwsh
        run: Write-Host "VOICE_P0=PASS installed Core completed real STT and real TTS"
