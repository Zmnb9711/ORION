name: ORION Alpha Windows Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main, baseline/build317-toolcall]
  push:
    branches: [main, voice/worker-launcher-lifecycle-v01, ci/adr004-qwen-vertical-slice]
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build-alpha:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - name: Install build dependencies
        shell: pwsh
        run: python -m pip install --upgrade pip; python -m pip install -e ".[dev,windows-audio,cloud-realtime,srs-radio]"
      - name: Run audio, Yandex, coordinator, and Qwen regression tests
        shell: pwsh
        run: python -m pytest -q tests/test_launcher_audio_sections.py tests/test_realtime_tool_api.py tests/test_realtime_live_core.py tests/test_realtime_session_control.py tests/test_yandex_realtime_provider.py tests/test_yandex_live_audio_core.py tests/test_yandex_live_lifecycle.py tests/test_yandex_playback_interrupt.py tests/test_yandex_credentials.py tests/test_yandex_realtime_session.py tests/test_yandex_srs_live_core.py tests/test_srs_protocol.py tests/test_srs_radio_transport.py tests/test_srs_codec_resampler.py tests/test_srs_transmission.py tests/test_srs_diagnostics.py tests/test_srs_packaging.py tests/test_qwen_realtime_provider.py tests/test_qwen_live_audio_core.py tests/test_qwen_live_audio_architecture.py tests/test_qwen_hardware_control.py tests/test_qwen_atc_tools.py tests/test_airport_atc_dialogue.py tests/test_atc_session_bootstrap.py tests/test_cloud_voice_config_store.py tests/test_core_process_boundary.py tests/test_legacy_voice_removal.py tests/test_build284_shutdown_contract.py
      - name: Build ORION Core
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name ORION-Core --collect-submodules orion --collect-submodules uvicorn --collect-submodules websocket --collect-submodules aiohttp --collect-all samplerate --collect-all numpy --add-binary "orion/native/win_amd64/opus.dll;native/win_amd64" --add-data "orion/native/licenses;native/licenses" --add-data "dcs-export;dcs-export" --icon branding/orion.ico orion/core_main.py
      - name: Run offline frozen Core SRS native smoke
        shell: pwsh
        run: |
          $resultPath = Join-Path $env:RUNNER_TEMP "orion-core-srs-native-smoke.json"
          $process = Start-Process "dist/ORION-Core/ORION-Core.exe" -ArgumentList @("--srs-native-smoke", $resultPath) -Wait -PassThru
          if ($process.ExitCode) { throw "Frozen Core SRS smoke exited $($process.ExitCode)" }
          $result = Get-Content $resultPath -Raw | ConvertFrom-Json
          if (-not $result.ok -or $result.opus_version -ne "libopus 1.6.1" -or $result.network_used -or $result.audio_devices_opened) { throw "Frozen SRS native smoke failed" }
      - name: Build ORION Launcher
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name ORION-Launcher --collect-submodules orion --collect-submodules uvicorn --collect-submodules websocket --collect-submodules aiohttp --exclude-module samplerate --exclude-module numpy --exclude-module orion.srs_opus --exclude-module orion.srs_resampler --exclude-module orion.srs_protocol --exclude-module orion.srs_transmission --exclude-module orion.srs_radio_transport --exclude-module orion.srs_diagnostics --exclude-module orion.yandex_srs_live_core --add-data "dcs-export;dcs-export" --icon branding/orion.ico --add-data "branding/orion.ico;branding" orion/launcher_main.py
      - name: Assemble canonical product layout
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "dist-product/Core","dist-product/Launcher","dist-product/Integration/DCS/Export" | Out-Null
          Copy-Item "dist/ORION-Core/*" "dist-product/Core" -Recurse -Force
          Copy-Item "dist/ORION-Launcher/*" "dist-product/Launcher" -Recurse -Force
          Copy-Item "dcs-export/*" "dist-product/Integration/DCS/Export" -Recurse -Force
          if(Test-Path "dist-product/Voice"){throw "Legacy Voice directory must not exist"}
      - name: Locate Inno Setup
        id: inno
        shell: pwsh
        run: |
          $c=@("C:\Program Files (x86)\Inno Setup 6\ISCC.exe","C:\Program Files\Inno Setup 6\ISCC.exe")
          $x=$c|?{Test-Path $_}|select -First 1
          if(-not $x){choco install innosetup -y --no-progress;$x=$c|?{Test-Path $_}|select -First 1}
          if(-not $x){throw "Inno missing"}
          "iscc=$x" >> $env:GITHUB_OUTPUT
      - name: Build Windows installer
        shell: pwsh
        run: '& "${{ steps.inno.outputs.iscc }}" "packaging/orion-alpha.iss"; if(-not(Test-Path "dist-installer/ORION-Alpha-0.2-Setup.exe")){throw "Installer missing"}'
      - name: Install package and prove Qwen-ready Core smoke
        shell: pwsh
        run: |
          $setup=(Resolve-Path "dist-installer/ORION-Alpha-0.2-Setup.exe").Path
          $install=Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait -PassThru
          if($install.ExitCode){throw "Installer failed: $($install.ExitCode)"}
          $root="C:\Program Files\ORION"
          $core="$root\Core\ORION-Core.exe"; $launcher="$root\Launcher\ORION-Launcher.exe"
          foreach($x in @($core,$launcher)){if(-not(Test-Path $x)){throw "Installed component missing: $x"}}
          $nativeResult=Join-Path $env:RUNNER_TEMP "orion-installed-core-srs-native.json"
          $native=Start-Process $core -ArgumentList @("--srs-native-smoke",$nativeResult) -Wait -PassThru
          if($native.ExitCode){throw "Installed Core SRS native smoke exited $($native.ExitCode)"}
          $nativeJson=Get-Content $nativeResult -Raw|ConvertFrom-Json
          if(-not $nativeJson.ok -or $nativeJson.network_used -or $nativeJson.audio_devices_opened){throw "Installed Core SRS native smoke failed"}
          if(Test-Path "$root\Voice"){throw "Legacy Voice directory was installed"}
          $runtime=Join-Path $env:RUNNER_TEMP "orion-installed-core"
          New-Item -ItemType Directory -Force $runtime | Out-Null
          $env:ORION_RUNTIME_DIR=$runtime; $env:ORION_CORE_BASE_URL="http://127.0.0.1:8000"
          $cp=Start-Process $core -PassThru
          try {
            $healthy=$false
            for($i=0;$i -lt 30;$i++){try{$h=Invoke-RestMethod "$env:ORION_CORE_BASE_URL/health" -TimeoutSec 1;if($h.status -eq "ok"){$healthy=$true;break}}catch{};Start-Sleep -Milliseconds 500}
            if(-not $healthy){throw "Installed Core did not become healthy"}
            $tools=Invoke-RestMethod "$env:ORION_CORE_BASE_URL/v1/realtime/tools"
            $toolNames=@($tools.tools | ForEach-Object {$_.name})
            if($toolNames.Count -ne 2 -or $toolNames -notcontains "orion.test.ping" -or $toolNames -notcontains "orion.virtual_atc.request"){throw "Realtime tool allowlist invalid"}
            $ping=@{call_id="ci-ping";name="orion.test.ping";arguments=@{message="qwen-smoke"}}|ConvertTo-Json -Depth 5
            $pr=Invoke-RestMethod "$env:ORION_CORE_BASE_URL/v1/realtime/tools/execute" -Method Post -ContentType "application/json" -Body $ping
            if(-not $pr.ok -or $pr.output.message -ne "qwen-smoke"){throw "ADR-004 packaged Core ping failed"}
            $live=Invoke-RestMethod "$env:ORION_CORE_BASE_URL/v1/realtime/qwen/live"
            if($live.state -ne "stopped"){throw "ADR-004 Qwen live service did not boot stopped"}
            $generic=Invoke-RestMethod "$env:ORION_CORE_BASE_URL/v1/realtime/live/status"
            if($generic.state -ne "stopped" -or $null -ne $generic.provider){throw "Provider-neutral live service did not boot stopped"}
          } finally { Stop-Process -Id $cp.Id -Force -ErrorAction SilentlyContinue }
      - name: Prove in-place upgrade stops a running packaged Core and restarts cleanly
        shell: pwsh
        run: |
          $setup=(Resolve-Path "dist-installer/ORION-Alpha-0.2-Setup.exe").Path
          $root="C:\Program Files\ORION"; $core="$root\Core\ORION-Core.exe"
          $runtime=Join-Path $env:RUNNER_TEMP "orion-upgrade-smoke"
          New-Item -ItemType Directory -Force $runtime | Out-Null
          $env:ORION_RUNTIME_DIR=$runtime; $env:ORION_CORE_BASE_URL="http://127.0.0.1:8000"
          $old=Start-Process $core -PassThru
          New-Item -ItemType Directory -Force "$root\Voice\whisper","$env:LOCALAPPDATA\ORION\runtime\voice","$env:LOCALAPPDATA\ORION\runtime\stt\whisper.cpp" | Out-Null
          Set-Content "$root\Voice\ORION-Voice.exe" "controlled legacy fixture"
          Set-Content "$env:LOCALAPPDATA\ORION\runtime\voice\state.json" "{}"
          Set-Content "$env:LOCALAPPDATA\ORION\runtime\stt\whisper.cpp\legacy.bin" "controlled legacy fixture"
          $healthy=$false
          for($i=0;$i -lt 30;$i++){try{$h=Invoke-RestMethod "$env:ORION_CORE_BASE_URL/health" -TimeoutSec 1;if($h.status -eq "ok"){$healthy=$true;break}}catch{};Start-Sleep -Milliseconds 500}
          if(-not $healthy){throw "Pre-upgrade Core did not become healthy"}
          $upgrade=Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait -PassThru
          if($upgrade.ExitCode){throw "In-place upgrade failed: $($upgrade.ExitCode)"}
          foreach($legacy in @("$root\Voice","$env:LOCALAPPDATA\ORION\runtime\voice","$env:LOCALAPPDATA\ORION\runtime\stt\whisper.cpp")){if(Test-Path $legacy){throw "Legacy artifact remained after upgrade: $legacy"}}
          Start-Sleep -Milliseconds 500
          if(Get-Process -Id $old.Id -ErrorAction SilentlyContinue){throw "Installer left old ORION-Core.exe running during upgrade"}
          $new=Start-Process $core -PassThru
          try {
            $healthy=$false
            for($i=0;$i -lt 30;$i++){try{$h=Invoke-RestMethod "$env:ORION_CORE_BASE_URL/health" -TimeoutSec 1;if($h.status -eq "ok"){$healthy=$true;break}}catch{};Start-Sleep -Milliseconds 500}
            if(-not $healthy){throw "Post-upgrade Core did not become healthy"}
            Start-Sleep -Seconds 2
            if($new.HasExited){throw "Post-upgrade Core exited unexpectedly: $($new.ExitCode)"}
          } finally { Stop-Process -Id $new.Id -Force -ErrorAction SilentlyContinue }
      - name: Prove packaged Launcher starts Core and preserves Build 317 audio API
        shell: pwsh
        run: |
          Get-Process ORION-Launcher,ORION-Core -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Milliseconds 500
          $root="C:\Program Files\ORION"
          $launcher="$root\Launcher\ORION-Launcher.exe"
          $runtime=Join-Path $env:RUNNER_TEMP "orion-launcher-core-smoke"
          New-Item -ItemType Directory -Force $runtime | Out-Null
          $env:ORION_RUNTIME_DIR=$runtime
          $lp=Start-Process $launcher -PassThru
          try {
            $healthy=$false
            for($i=0;$i -lt 40;$i++){
              if($lp.HasExited){throw "Packaged Launcher exited before Core became healthy: $($lp.ExitCode)"}
              try{$h=Invoke-RestMethod "http://127.0.0.1:8000/health" -TimeoutSec 1;if($h.status -eq "ok"){$healthy=$true;break}}catch{}
              Start-Sleep -Milliseconds 500
            }
            if(-not $healthy){
              $startup=Join-Path $runtime "core-startup.log"
              $detail=if(Test-Path $startup){Get-Content $startup -Raw}else{"core-startup.log missing"}
              throw "Launcher did not bring Core to healthy state. $detail"
            }
            $inputs=Invoke-RestMethod "http://127.0.0.1:8000/v1/windows-audio/wasapi/inputs" -TimeoutSec 3
            $outputs=Invoke-RestMethod "http://127.0.0.1:8000/v1/windows-audio/wasapi/outputs" -TimeoutSec 3
            $selection=Invoke-RestMethod "http://127.0.0.1:8000/v1/windows-audio/selection" -TimeoutSec 3
            if($null -eq $inputs){throw "Build 317 audio inputs endpoint returned null"}
            if($null -eq $outputs){throw "Build 317 audio outputs endpoint returned null"}
            if($null -eq $selection -or $null -eq $selection.selection){throw "Build 317 audio selection endpoint is invalid"}
            $live=Invoke-RestMethod "http://127.0.0.1:8000/v1/realtime/qwen/live" -TimeoutSec 3
            if($live.state -ne "stopped"){throw "Qwen live service did not boot stopped through Launcher-owned Core"}
            $generic=Invoke-RestMethod "http://127.0.0.1:8000/v1/realtime/live/status" -TimeoutSec 3
            if($generic.state -ne "stopped" -or $null -ne $generic.provider){throw "Provider-neutral live service did not boot stopped through Launcher-owned Core"}
            if(Get-Process ORION-Voice,whisper-stream -ErrorAction SilentlyContinue){throw "Legacy voice process started"}
            Start-Sleep -Seconds 2
            if($lp.HasExited){throw "Packaged Launcher exited unexpectedly after Core became healthy: $($lp.ExitCode)"}
          } finally {
            Get-Process ORION-Launcher,ORION-Core -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ORION-Alpha-0.2-Setup
          path: dist-installer/ORION-Alpha-0.2-Setup.exe
          if-no-files-found: error
      - name: Publish validated installer to GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/voice/worker-launcher-lifecycle-v01'
        shell: pwsh
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          $tag="alpha-0.2-build-${{ github.run_number }}"
          gh release create $tag "dist-installer/ORION-Alpha-0.2-Setup.exe" --target "${{ github.sha }}" --title "ORION Alpha 0.2 — Build #${{ github.run_number }}" --notes "Validated ORION Alpha 0.2 test build." --prerelease
