name: ORION Alpha Windows Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, voice/worker-launcher-lifecycle-v01]
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build-alpha:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - name: Install build dependencies
        shell: pwsh
        run: python -m pip install --upgrade pip; python -m pip install -e ".[dev,windows-audio]"
      - name: Run Voice regression tests
        shell: pwsh
        run: python -m pytest -q tests/test_voice_text_bridge_api.py tests/test_whisper_voice_worker.py
      - name: Build ORION Core
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name ORION-Core --collect-submodules orion --collect-submodules uvicorn --add-data "dcs-export;dcs-export" --icon branding/orion.ico orion/core_main.py
      - name: Build ORION Launcher
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name ORION-Launcher --collect-submodules orion --collect-submodules uvicorn --add-data "dcs-export;dcs-export" --icon branding/orion.ico --add-data "branding/orion.ico;branding" orion/launcher_main.py
      - name: Build ORION Voice
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name ORION-Voice --collect-submodules orion --icon branding/orion.ico orion/whisper_voice_worker.py
      - name: Download pinned whisper.cpp live runtime
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/ggml-org/whisper.cpp/releases/download/v1.8.6/whisper-bin-x64.zip" -OutFile whisper.zip
          Expand-Archive whisper.zip whisper-runtime -Force
      - name: Assemble canonical product layout
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "dist-product/Core","dist-product/Launcher","dist-product/Voice","dist-product/Voice/whisper","dist-product/Integration/DCS/Export" | Out-Null
          Copy-Item "dist/ORION-Core/*" "dist-product/Core" -Recurse -Force; Copy-Item "dist/ORION-Launcher/*" "dist-product/Launcher" -Recurse -Force; Copy-Item "dist/ORION-Voice/*" "dist-product/Voice" -Recurse -Force
          $bin=(Get-ChildItem whisper-runtime -Recurse -Filter whisper-stream.exe|Select-Object -First 1).Directory.FullName; Copy-Item "$bin/*" "dist-product/Voice/whisper" -Recurse -Force; Copy-Item "dcs-export/*" "dist-product/Integration/DCS/Export" -Recurse -Force
          foreach($p in @("dist-product/Voice/ORION-Voice.exe","dist-product/Voice/whisper/whisper-stream.exe","dist-product/Voice/whisper/SDL2.dll")){if(-not(Test-Path $p)){throw "Missing $p"}}
      - name: Verify live Whisper executable starts
        shell: pwsh
        run: '& "dist-product/Voice/whisper/whisper-stream.exe" --help | Out-Null; if($LASTEXITCODE -ne 0){throw "whisper-stream failed"}'
      - name: Locate Inno Setup
        id: inno
        shell: pwsh
        run: |
          $c=@("C:\Program Files (x86)\Inno Setup 6\ISCC.exe","C:\Program Files\Inno Setup 6\ISCC.exe"); $x=$c|?{Test-Path $_}|select -First 1; if(-not $x){choco install innosetup -y --no-progress;$x=$c|?{Test-Path $_}|select -First 1}; if(-not $x){throw "Inno missing"}; "iscc=$x" >> $env:GITHUB_OUTPUT
      - name: Build Windows installer
        shell: pwsh
        run: '& "${{ steps.inno.outputs.iscc }}" "packaging/orion-alpha.iss"; if(-not(Test-Path "dist-installer/ORION-Alpha-0.2-Setup.exe")){throw "Installer missing"}'
      - name: Install package and prove Voice reaches microphone boundary
        shell: pwsh
        run: |
          $setup=(Resolve-Path "dist-installer/ORION-Alpha-0.2-Setup.exe").Path; $p=Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait -PassThru; if($p.ExitCode){throw "Installer failed"}
          $root="C:\Program Files\ORION"; $core="$root\Core\ORION-Core.exe"; $voice="$root\Voice\ORION-Voice.exe"; $stream="$root\Voice\whisper\whisper-stream.exe"
          foreach($x in @($core,$voice,$stream)){if(-not(Test-Path $x)){throw "Installed component missing: $x"}}
          $runtime=Join-Path $env:RUNNER_TEMP "orion-installed-voice"; New-Item -ItemType Directory -Force $runtime | Out-Null
          $modelDir=Join-Path $runtime "stt\whisper.cpp\models"; New-Item -ItemType Directory -Force $modelDir | Out-Null
          # A tiny placeholder is sufficient here: the acceptance criterion is that packaged Voice starts whisper-stream and reaches SDL microphone initialization; CI runners have no physical microphone.
          Set-Content -Encoding Byte -Path (Join-Path $modelDir "ggml-medium.bin") -Value ([byte[]](0))
          $env:ORION_RUNTIME_DIR=$runtime; $env:ORION_CORE_BASE_URL="http://127.0.0.1:8000"
          $cp=Start-Process $core -PassThru
          try {
            for($i=0;$i -lt 30;$i++){try{$h=Invoke-RestMethod "$env:ORION_CORE_BASE_URL/health" -TimeoutSec 1;if($h.status -eq "ok"){break}}catch{};Start-Sleep -Milliseconds 500}
            $body=@{text="Привет. Как дела?";source="whisper";language="ru"}|ConvertTo-Json; $r=Invoke-RestMethod "$env:ORION_CORE_BASE_URL/v1/voice/text" -Method Post -ContentType "application/json; charset=utf-8" -Body ([Text.Encoding]::UTF8.GetBytes($body)); if($r.reply -ne "Всё хорошо. Связь установлена."){throw "Voice text bridge failed"}
            $vp=Start-Process $voice -PassThru; Start-Sleep -Seconds 5
            $statePath=Join-Path $runtime "voice\state.json"; if(-not(Test-Path $statePath)){throw "Installed ORION-Voice did not publish state"}; $s=Get-Content $statePath -Raw|ConvertFrom-Json
            Write-Host "VOICE_PROCESS_STATE=$($s.state)"; Write-Host "VOICE_PROCESS_ERROR=$($s.error)"
            if($s.state -eq "STARTING"){throw "Voice never reached whisper-stream"}
            if($s.state -eq "ERROR" -and $s.error -match "missing:.*whisper-stream"){throw "Packaged Voice could not locate installed whisper-stream"}
            if($s.state -eq "ERROR" -and $s.error -match "Whisper model is missing"){throw "Packaged Voice could not locate runtime model"}
            # ERROR from SDL/no capture device or model validation is acceptable on hosted CI: it proves the installed process crossed our Python/package boundary and invoked whisper-stream. LISTENING is stronger and also passes.
            Write-Host "INSTALLED_VOICE_PROCESS_BOUNDARY=PASS"
            Stop-Process -Id $vp.Id -Force -ErrorAction SilentlyContinue
          } finally {Stop-Process -Id $cp.Id -Force -ErrorAction SilentlyContinue}
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ORION-Alpha-0.2-Setup
          path: dist-installer/ORION-Alpha-0.2-Setup.exe
          if-no-files-found: error
