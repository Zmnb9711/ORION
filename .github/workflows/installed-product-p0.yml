name: Installed Product P0 Gate

on:
  workflow_dispatch:
  push:
    branches:
      - hardening/launcher-core
    paths:
      - "orion/**"
      - "packaging/**"
      - "tests/**"
      - ".github/workflows/installed-product-p0.yml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  installed-product-p0:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,windows-audio]"

      - name: Build production Core
        shell: pwsh
        run: |
          $args = @(
            "--noconfirm", "--clean", "--onedir", "--console",
            "--name", "ORION-Core",
            "--collect-submodules", "orion",
            "--collect-submodules", "uvicorn",
            "--add-data", "dcs-export;dcs-export",
            "--add-data", "dcs-mission-pack;dcs-mission-pack",
            "--add-data", "dcs-mission-template;dcs-mission-template",
            "--icon", "branding/orion.ico",
            "orion/core_main.py"
          )
          python -m PyInstaller @args

      - name: Build production Launcher
        shell: pwsh
        run: |
          $args = @(
            "--noconfirm", "--clean", "--onedir", "--windowed",
            "--name", "ORION-Launcher",
            "--collect-submodules", "orion",
            "--collect-submodules", "uvicorn",
            "--add-data", "dcs-export;dcs-export",
            "--icon", "branding/orion.ico",
            "--add-data", "branding/orion.ico;branding",
            "orion/launcher_main.py"
          )
          python -m PyInstaller @args

      - name: Build production Uninstaller
        shell: pwsh
        run: |
          $args = @(
            "--noconfirm", "--clean", "--onefile", "--windowed",
            "--name", "ORION-Uninstall",
            "--collect-submodules", "orion",
            "--icon", "branding/orion.ico",
            "orion/uninstall_main.py"
          )
          python -m PyInstaller @args

      - name: Assemble production payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "dist-product/Core","dist-product/Launcher","dist-product/Uninstaller","dist-product/Integration/DCS/Export","dist-product/Integration/DCS/MissionPack","dist-product/Integration/DCS/MissionTemplate" | Out-Null
          Copy-Item "dist/ORION-Core/*" "dist-product/Core" -Recurse -Force
          Copy-Item "dist/ORION-Launcher/*" "dist-product/Launcher" -Recurse -Force
          Copy-Item "dist/ORION-Uninstall.exe" "dist-product/Uninstaller/ORION-Uninstall.exe" -Force
          Copy-Item "dcs-export/*" "dist-product/Integration/DCS/Export" -Recurse -Force
          Copy-Item "dcs-mission-pack/*" "dist-product/Integration/DCS/MissionPack" -Recurse -Force
          Copy-Item "dcs-mission-template/*" "dist-product/Integration/DCS/MissionTemplate" -Recurse -Force

      - name: Locate Inno Setup
        id: inno
        shell: pwsh
        run: |
          $candidates = @("C:\Program Files (x86)\Inno Setup 6\ISCC.exe", "C:\Program Files\Inno Setup 6\ISCC.exe")
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "Inno Setup compiler not found" }
          "iscc=$iscc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build production installer
        shell: pwsh
        run: |
          & "${{ steps.inno.outputs.iscc }}" "packaging/orion-alpha.iss"
          if (-not (Test-Path "dist-installer/ORION-Alpha-0.2-Setup.exe")) { throw "Installer was not created" }

      - name: Clean any pre-existing ORION state
        shell: pwsh
        run: |
          Get-Process ORION-Launcher,ORION-Core -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\Program Files\ORION" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:LOCALAPPDATA "ORION") -Recurse -Force -ErrorAction SilentlyContinue

      - name: Install the actual production installer
        shell: pwsh
        run: |
          $setup = (Resolve-Path "dist-installer/ORION-Alpha-0.2-Setup.exe").Path
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed with exit code $($p.ExitCode)" }
          $launcher = "C:\Program Files\ORION\Launcher\ORION-Launcher.exe"
          $core = "C:\Program Files\ORION\Core\ORION-Core.exe"
          if (-not (Test-Path $launcher)) { throw "Installed Launcher is missing: $launcher" }
          if (-not (Test-Path $core)) { throw "Installed Core is missing: $core" }

      - name: Verify installed executable hashes match built payload
        shell: pwsh
        run: |
          $pairs = @(
            @("dist-product/Core/ORION-Core.exe", "C:\Program Files\ORION\Core\ORION-Core.exe"),
            @("dist-product/Launcher/ORION-Launcher.exe", "C:\Program Files\ORION\Launcher\ORION-Launcher.exe"),
            @("dist-product/Uninstaller/ORION-Uninstall.exe", "C:\Program Files\ORION\Uninstaller\ORION-Uninstall.exe")
          )
          foreach ($pair in $pairs) {
            $built = (Get-FileHash $pair[0] -Algorithm SHA256).Hash
            $installed = (Get-FileHash $pair[1] -Algorithm SHA256).Hash
            Write-Host "$($pair[1]) SHA256=$installed"
            if ($built -ne $installed) { throw "Installed payload hash mismatch for $($pair[1])" }
          }

      - name: Browser-free installed Launcher startup
        shell: pwsh
        run: |
          $browserNames = @("msedge","chrome","firefox","brave","opera")
          $before = @{}
          foreach ($name in $browserNames) {
            Get-Process $name -ErrorAction SilentlyContinue | ForEach-Object { $before[$_.Id] = $true }
          }
          $runtime = Join-Path $env:LOCALAPPDATA "ORION\runtime"
          New-Item -ItemType Directory -Force $runtime | Out-Null
          $env:ORION_RUNTIME_DIR = $runtime
          $launcher = Start-Process -FilePath "C:\Program Files\ORION\Launcher\ORION-Launcher.exe" -WorkingDirectory "C:\Program Files\ORION\Launcher" -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              if ($launcher.HasExited) { throw "Installed Launcher exited unexpectedly" }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8000/health" -TimeoutSec 1
                if ($health.status -eq "ok") { $ready = $true; break }
              } catch {}
            }
            if (-not $ready) { throw "Installed Launcher did not start installed Core" }
            Start-Sleep -Seconds 3
            $newBrowsers = @()
            foreach ($name in $browserNames) {
              Get-Process $name -ErrorAction SilentlyContinue | ForEach-Object {
                if (-not $before.ContainsKey($_.Id)) { $newBrowsers += "$($_.ProcessName):$($_.Id)" }
              }
            }
            if ($newBrowsers.Count -gt 0) { throw "Launcher opened browser process(es): $($newBrowsers -join ', ')" }
            $core = @(Get-CimInstance Win32_Process | Where-Object { $_.Name -eq "ORION-Core.exe" })
            if ($core.Count -ne 1) { throw "Expected one installed Core, found $($core.Count)" }
            if ($core[0].ExecutablePath -ne "C:\Program Files\ORION\Core\ORION-Core.exe") { throw "Launcher started unexpected Core path: $($core[0].ExecutablePath)" }
          } finally {
            if (-not $launcher.HasExited) { Stop-Process -Id $launcher.Id -Force -ErrorAction SilentlyContinue }
            Get-Process ORION-Core -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: Reinstall over a running product and prove old Core is replaced
        shell: pwsh
        run: |
          $env:ORION_RUNTIME_DIR = Join-Path $env:LOCALAPPDATA "ORION\runtime"
          $launcher = Start-Process -FilePath "C:\Program Files\ORION\Launcher\ORION-Launcher.exe" -PassThru
          $oldPid = $null
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Milliseconds 500
            $core = @(Get-Process ORION-Core -ErrorAction SilentlyContinue)
            if ($core.Count -eq 1) { $oldPid = $core[0].Id; break }
          }
          if (-not $oldPid) { throw "Could not establish old Core PID before upgrade" }
          Write-Host "Old Core PID=$oldPid"
          $setup = (Resolve-Path "dist-installer/ORION-Alpha-0.2-Setup.exe").Path
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Upgrade installer failed with exit code $($p.ExitCode)" }
          Start-Sleep -Seconds 1
          if (Get-Process -Id $oldPid -ErrorAction SilentlyContinue) { throw "Old Core PID survived installer upgrade" }
          if (Get-Process -Id $launcher.Id -ErrorAction SilentlyContinue) { throw "Old Launcher PID survived installer upgrade" }
          $builtCore = (Get-FileHash "dist-product/Core/ORION-Core.exe" -Algorithm SHA256).Hash
          $installedCore = (Get-FileHash "C:\Program Files\ORION\Core\ORION-Core.exe" -Algorithm SHA256).Hash
          if ($builtCore -ne $installedCore) { throw "Upgrade did not install the current Core payload" }

      - name: Prepare official Whisper runtime and real speech sample
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP "orion-installed-p0-runtime"
          $stt = Join-Path $runtime "stt\whisper.cpp"
          $downloads = Join-Path $env:RUNNER_TEMP "orion-installed-p0-downloads"
          Remove-Item $runtime -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $downloads -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $stt,$downloads | Out-Null
          $zip = Join-Path $downloads "whisper-bin-x64.zip"
          Invoke-WebRequest -Uri "https://github.com/ggml-org/whisper.cpp/releases/download/v1.8.6/whisper-bin-x64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath (Join-Path $downloads "whisper") -Force
          $cli = Get-ChildItem (Join-Path $downloads "whisper") -Recurse -Filter "whisper-cli.exe" | Select-Object -First 1
          if (-not $cli) { throw "Official whisper-cli.exe not found" }
          Copy-Item (Join-Path $cli.Directory.FullName "*") $stt -Recurse -Force
          Set-Content -Path (Join-Path $stt "ORION_WHISPER_RUNTIME_VERSION.txt") -Value "v1.8.6" -Encoding UTF8
          if (-not (Test-Path (Join-Path $stt "ggml-cpu.dll"))) { throw "ggml-cpu.dll is missing" }
          $model = Join-Path $stt "ggml-tiny.en.bin"
          Invoke-WebRequest -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin?download=true" -OutFile $model
          $wav = Join-Path $downloads "jfk.wav"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/ggml-org/whisper.cpp/master/samples/jfk.wav" -OutFile $wav
          "ORION_RUNTIME_DIR=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ORION_WHISPER_ROOT=$stt" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ORION_WHISPER_MODEL=$model" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ORION_STT_SAMPLE=$wav" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Installed Core real STT P0
        shell: pwsh
        run: |
          $core = "C:\Program Files\ORION\Core\ORION-Core.exe"
          $output = & $core --stt-smoke $env:ORION_STT_SAMPLE --stt-language en 2>&1
          $code = $LASTEXITCODE
          $text = ($output | Out-String).Trim()
          Write-Host "===== installed STT ====="
          Write-Host $text
          if ($code -ne 0) { throw "Installed Core STT failed with exit code $code" }
          $normalized = $text.ToLowerInvariant()
          if ($normalized -notmatch "country" -or $normalized -notmatch "you") { throw "Installed Core did not recognize expected speech: $text" }

      - name: Installed Core real TTS P0
        shell: pwsh
        run: |
          $core = "C:\Program Files\ORION\Core\ORION-Core.exe"
          $tts = Join-Path $env:RUNNER_TEMP "orion-installed-tts.wav"
          Remove-Item $tts -Force -ErrorAction SilentlyContinue
          & $core --tts-smoke $tts --tts-text "Всё хорошо. Связь установлена."
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "Installed Core TTS failed with exit code $code" }
          if (-not (Test-Path $tts)) { throw "Installed Core did not create TTS WAV" }
          if ((Get-Item $tts).Length -le 44) { throw "Installed Core created empty TTS WAV" }
          Write-Host "TTS WAV=$tts bytes=$((Get-Item $tts).Length) sha256=$((Get-FileHash $tts -Algorithm SHA256).Hash)"

      - name: Show P0 Core startup diagnostics
        if: always()
        shell: pwsh
        run: |
          $log = Join-Path $env:ORION_RUNTIME_DIR "core-startup.log"
          if (Test-Path $log) {
            Write-Host "===== core-startup.log ====="
            Get-Content $log
          }
