[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-dcs"
version = "0.2.0-alpha"
description = "AI mission control and virtual ATC core for DCS World"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.9,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pystray>=0.19,<1.0; platform_system == 'Windows'",
  "pygame>=2.6,<3.0; platform_system == 'Windows'",
]

[project.scripts]
orion = "orion.launcher:main"
orion-core = "orion.core_main:main"
orion-launcher = "orion.launcher_main:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pyinstaller>=6.10,<7.0",
  "pyright>=1.1.400,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.12,<1.0",
]
windows-audio = [
  "sounddevice>=0.5,<1.0",
]
cloud-realtime = [
  "aiohttp>=3.9,<4.0",
  "websocket-client>=1.8,<2.0",
]
srs-radio = [
  "grpcio>=1.83.1,<2.0",
  "numpy>=1.23,<3.0",
  "protobuf>=7.35.1,<8.0",
  "samplerate==0.2.4",
]

[tool.setuptools.packages.find]
include = ["orion*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["orion"]
# Native desktop shells and pure presentation mixins are exercised by dedicated
# Windows import/frozen Launcher gates. Counting Tk event/presentation code in
# the backend unit metric makes UI-only changes dilute otherwise unchanged core
# coverage without improving functional confidence.
omit = [
  "orion/desktop_app.py",
  "orion/desktop_app_windows.py",
  "orion/desktop_launcher.py",
  "orion/launcher_cloud_voice_sections.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingTypeStubs = false

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Correctness-first linting. #65.5 adds bug-risk rules incrementally rather than
# forcing a repository-wide style rewrite in one change.
select = ["E9", "F63", "F7", "F82", "B006", "B008"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI intentionally uses Query(...) objects as declarative endpoint defaults.
extend-immutable-calls = ["fastapi.Query"]
