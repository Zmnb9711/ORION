[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-dcs"
version = "0.2.0-alpha"
description = "AI mission control and virtual ATC core for DCS World"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.9,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pystray>=0.19,<1.0; platform_system == 'Windows'",
]

[project.scripts]
orion = "orion.launcher:main"
orion-core = "orion.core_main:main"
orion-launcher = "orion.launcher_main:main"
