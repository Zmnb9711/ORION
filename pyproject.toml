[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-dcs"
version = "0.1.0"
description = "AI mission control and virtual ATC core for DCS World"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.9,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
orion = "orion.launcher:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pyinstaller>=6.10,<7.0",
  "pyright>=1.1.400,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.12,<1.0",
]
windows-audio = [
  "sounddevice>=0.5,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["orion"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingTypeStubs = false

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Correctness-first linting. #65.5 adds bug-risk rules incrementally rather than
# forcing a repository-wide style rewrite in one change.
select = ["E9", "F63", "F7", "F82", "B006", "B008"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI intentionally uses Query(...) objects as declarative endpoint defaults.
extend-immutable-calls = ["fastapi.Query"]
